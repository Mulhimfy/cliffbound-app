name: iOS build check

# Compiles the iOS app for the simulator: no signing, no archive, no upload. Catches Swift,
# storyboard and Xcode project errors (the native Reminders plugin) without making an IPA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capacitor plugins + web bundle into the native project
        run: npm ci && npx cap sync ios
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E "error:|warning: .*Reminders|\*\* BUILD" "$RUNNER_TEMP/build.log" | head -60
              exit 1
            }
          grep -E "Reminders.swift|\*\* BUILD" "$RUNNER_TEMP/build.log" | tail -5
